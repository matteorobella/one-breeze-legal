# Pubblica il sito (landing + documenti legali) su GitHub Pages.
#
# Sostituisce il vecchio build "legacy" basato su Jekyll, che falliva senza
# dare un motivo. Qui il sito è già HTML statico: si carica la cartella così
# com'è, senza nessuna elaborazione di mezzo.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
